[versions]
# Build tools / Build tools (версии инструментов сборки)
agp = "8.5.0"
kotlin = "2.0.0"
# KSP (Kotlin Symbol Processing) — fast annotation processing, replaces KAPT / KSP (Kotlin Symbol Processing) — быстрая обработка аннотаций, заменяет KAPT
ksp = "2.0.0-1.0.24"

# AndroidX / AndroidX
coreKtx = "1.13.1"
coreSplashscreen = "1.0.1"
appcompat = "1.7.0"
constraintlayout = "2.1.4"
fragmentKtx = "1.8.4"
lifecycle = "2.8.7"
recyclerView = "1.3.2"

# Material Design / Material Design (Material 2)
material = "1.12.0"

# Coroutines / Coroutines (Kotlin Coroutines + Flow)
coroutines = "1.8.1"

# Hilt (DI) / Hilt (внедрение зависимостей)
hilt = "2.51.1"

# Room (local DB) / Room (локальная БД)
room = "2.6.1"

# Retrofit (network) / Retrofit (сеть)
retrofit = "2.11.0"
okhttp = "4.12.0"

# kotlinx.serialization / kotlinx.serialization (десериализация JSON)
kotlinxSerialization = "1.6.3"
retrofitKotlinxSerializationConverter = "1.0.0"

# Jetpack Navigation / Jetpack Navigation (навигация)
navigation = "2.7.7"

# Timber (logging) / Timber (логирование)
timber = "5.0.1"

# LeakCanary (memory leak detection, debug only) / LeakCanary (детекция утечек памяти, только debug)
leakcanary = "2.14"

# Coil (image loading, Kotlin-first, Coroutines) / Coil (загрузка картинок, Kotlin-first, Coroutines)
coil = "2.7.0"

# Core library desugaring (Java 8 time API on minSdk < 26) / Core library desugaring (Java 8 time API на minSdk < 26)
desugarJdkLibs = "2.0.4"

# Testing / Тестирование
junit = "4.13.2"
mockitoKotlin = "5.4.0"
turbine = "1.1.0"
robolectric = "4.13"
hamcrest = "2.2"
coroutinesTest = "1.8.1"

[libraries]
# AndroidX core / AndroidX core
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerView" }

# Material Design / Material Design
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Coroutines / Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Hilt (DI) / Hilt (внедрение зависимостей)
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Room (local DB) / Room (локальная БД)
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Retrofit (network) / Retrofit (сеть)
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerializationConverter" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# kotlinx.serialization / kotlinx.serialization (десериализация JSON)
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Jetpack Navigation / Jetpack Navigation (навигация)
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# Timber (logging) / Timber (логирование)
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# LeakCanary (memory leak detection, debug only) / LeakCanary (детекция утечек памяти, только debug)
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# Coil (image loading, Kotlin-first, Coroutines) / Coil (загрузка картинок, Kotlin-first, Coroutines)
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Core library desugaring / Core library desugaring (Java 8 time API на minSdk < 26)
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# Testing / Тестирование
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
hamcrest = { group = "org.hamcrest", name = "hamcrest", version.ref = "hamcrest" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Hilt plugin / Плагин Hilt (обработка аннотаций DI)
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# kotlinx.serialization plugin / Плагин kotlinx.serialization (генерация сериализаторов)
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Navigation Safe Args plugin / Плагин Navigation Safe Args (генерация типобезопасной навигации)
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
# KSP plugin (Kotlin Symbol Processing — fast annotation processing for Hilt, Room) / Плагин KSP (Kotlin Symbol Processing — быстрая обработка аннотаций для Hilt, Room)
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
